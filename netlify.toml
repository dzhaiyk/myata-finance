[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Прокси к iiko: ключ живёт в переменных окружения Netlify, не во фронтенде.
# Правило должно стоять ДО SPA-редиректа, иначе запрос уйдёт в index.html.
[[redirects]]
  from = "/api/iiko"
  to = "/.netlify/functions/iiko"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
